spring.application.name=eventhub-backend

spring.datasource.url=jdbc:mysql://localhost:3306/eventhub
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#app.jwt.secret=${JWT_SECRET}
app.jwt.secret=${JWT_SECRET:local-dev-secret-key-123456789012345678901234567890}
app.jwt.expiration-minutes=60
server.error.include-stacktrace=never

app.cors.allowed-origins=http://localhost:5173
app.booking.stock-strategy=atomic

app.payment.enabled=true
app.payment.hold-minutes=10
app.payment.expiry-check-seconds=30

app.frontend-url=http://localhost:5173
app.mail.mode=log
app.mail.from=EventHub <no-reply@eventhub.local>
app.mail.send-interval-seconds=5
app.mail.max-attempts=5
app.reminders.hours-before=24
app.reminders.check-minutes=60